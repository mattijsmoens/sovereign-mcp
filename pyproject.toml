[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sovereign-mcp"
version = "1.6.0"
description = "Deterministic MCP Security Architecture. FrozenNamespace as Root of Trust for Model Context Protocol tool verification."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.8"
authors = [
    {name = "Mattijs Moens", email = "moenster007@proton.me"}
]
keywords = [
    "mcp-security",
    "ai-security",
    "deterministic-verification",
    "tool-verification",
    "frozen-namespace",
    "prompt-injection",
    "consensus-verification",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
sidecar = ["fastapi>=0.100.0", "uvicorn>=0.20.0"]
# Protect a server built on the official MCP SDK:
#   pip install "sovereign-mcp[mcp]"
# Deliberately not pinned to 2.x. The published MCP servers (mcp-server-git,
# -fetch, -sqlite, -time) require 1.x and break on 2.0, so pinning >=2.0.0
# here would force an unusable combination on anyone installing both. The
# adapter supports both lines; 1.29 and 2.0 are the versions tested.
mcp = ["mcp>=1.29"]
# The gating proxy lives in its own package, sovereign-mcp-gateway. It is a
# composition layer over all four packages, so it depends on this library
# rather than the other way round - an extra here would have made the library
# optionally depend on three of its own peers.

[project.scripts]
sovereign-mcp-sidecar = "sovereign_mcp.sidecar:main"
sovereign-mcp-audit = "sovereign_mcp.audit:main"

[project.urls]
Homepage = "https://github.com/mattijsmoens/sovereign-mcp"

[tool.setuptools.packages.find]
include = ["sovereign_mcp*"]

[tool.setuptools.package-data]
sovereign_mcp = ["*.c", "*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
